-- Les boutons du mode creation (Wizard.dirk), quel que soit le jeu
-- =======================================================================
-- Lu seulement par Wizard.dirk (Dirk du 09/10/2026 ou plus recent). Chaque
-- ligne ici passe avant celle du jeu (son Cfg/controls.cfg, ou celui de
-- KimmyScript/Cfg) et avant une manette reglee avec F9 : le bouton
-- physique donne toujours ce qui est ecrit ici. Ce qui n'est pas ecrit
-- reste comme dans le jeu. Les jeux eux-memes ne voient rien de ce fichier.
-- Memes noms que controls.cfg (KEY_*, JOY_*, RAWJOY_0..3.*).
--
-- Depuis le 12/10/2026, toutes les commandes dont Wizard se sert sont ici,
-- avec les touches du controls.cfg partage : Wizard repond de la meme
-- facon dans tous les jeux, meme quand le jeu a son propre controls.cfg
-- (avec d'autres touches, ou d'anciens noms Singe qui ne marchent plus).
--
-- Par defaut, B3 est sur X (manette) et sur le bouton 0 des sticks
-- d'arcade, qui sont SAVE_MENU dans un jeu : Wizard ne s'en sert pas.
--
-- Manettes : JOY_A, JOY_B, JOY_X, JOY_Y sont des positions (bas, droite,
-- gauche, haut), comme une manette Xbox. Sur une manette ou une console
-- marquee a la Nintendo (A a droite, X en haut), JOY_Y est le bouton du
-- haut, marque X, et JOY_X celui de gauche, marque Y.


GO_UP           = { KEY_UP, JOY_UP, JOY_STICK_UP, RAWJOY_0.AXIS_1_NEG, RAWJOY_1.AXIS_1_NEG, RAWJOY_2.AXIS_1_NEG, RAWJOY_3.AXIS_1_NEG }
GO_LEFT         = { KEY_LEFT, JOY_LEFT, JOY_STICK_LEFT, RAWJOY_0.AXIS_0_NEG, RAWJOY_1.AXIS_0_NEG, RAWJOY_2.AXIS_0_NEG, RAWJOY_3.AXIS_0_NEG }
GO_DOWN         = { KEY_DOWN, JOY_DOWN, JOY_STICK_DOWN, RAWJOY_0.AXIS_1_POS, RAWJOY_1.AXIS_1_POS, RAWJOY_2.AXIS_1_POS, RAWJOY_3.AXIS_1_POS }
GO_RIGHT        = { KEY_RIGHT, JOY_RIGHT, JOY_STICK_RIGHT, RAWJOY_0.AXIS_0_POS, RAWJOY_1.AXIS_0_POS, RAWJOY_2.AXIS_0_POS, RAWJOY_3.AXIS_0_POS }
                        -- se deplacer dans le film et dans les listes

BUTTON_1        = { KEY_LCTRL, JOY_A, RAWJOY_0.BUTTON_3, RAWJOY_1.BUTTON_3, RAWJOY_2.BUTTON_3, RAWJOY_3.BUTTON_3 }
                        -- B1 : menu, choisir, marquer

BUTTON_2        = { KEY_LALT, JOY_B, RAWJOY_0.BUTTON_4, RAWJOY_1.BUTTON_4, RAWJOY_2.BUTTON_4, RAWJOY_3.BUTTON_4 }
                        -- B2 : GO TO

BUTTON_3        = { KEY_SPACE, JOY_X, RAWJOY_0.BUTTON_0, RAWJOY_1.BUTTON_0, RAWJOY_2.BUTTON_0, RAWJOY_3.BUTTON_0 }
                        -- B3 : annuler (undo), lacher une marque, fermer une liste

PAUSE_GAME      = { KEY_P, JOY_Y, RAWJOY_0.BUTTON_1, RAWJOY_1.BUTTON_1, RAWJOY_2.BUTTON_1, RAWJOY_3.BUTTON_1 }
                        -- B4 : lire / arreter le film, arreter un essai

SAVE_1          = { KEY_F1, JOY_L1, RAWJOY_0.BUTTON_2, RAWJOY_1.BUTTON_2, RAWJOY_2.BUTTON_2, RAWJOY_3.BUTTON_2 }
                        -- L1 : le niveau, la scene, le move... precedent

SAVE_2          = { KEY_F2, JOY_R1, RAWJOY_0.BUTTON_5, RAWJOY_1.BUTTON_5, RAWJOY_2.BUTTON_5, RAWJOY_3.BUTTON_5 }
                        -- R1 : le suivant

START_1P        = { KEY_MAIN_1, JOY_START, RAWJOY_0.BUTTON_6, RAWJOY_1.BUTTON_6, RAWJOY_2.BUTTON_6, RAWJOY_3.BUTTON_6 }
                        -- START : fermer une liste ; avec SELECT, quitter

COIN_1P         = { KEY_MAIN_5, JOY_SELECT, RAWJOY_0.BUTTON_7, RAWJOY_1.BUTTON_7, RAWJOY_2.BUTTON_7, RAWJOY_3.BUTTON_7 }
                        -- SELECT : la taille du texte ; avec START, quitter

EXIT_MENU       = { KEY_ESCAPE, KEY_Q, RAWJOY_0.BUTTON_11, RAWJOY_1.BUTTON_11, RAWJOY_2.BUTTON_11, RAWJOY_3.BUTTON_11 }
                        -- ESC : quitter (apres un oui), fermer une liste
