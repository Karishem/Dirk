-- Default Mappings 4.1 (noms simplifies)
--
-- Ce que fait chaque entree (jeux n'utilisant pas le tir)
-- =======================================================================
-- Ces noms remplacent les INPUT_* d'origine (herites du schema d'entree
-- de Daphne) par quelque chose de plus lisible -- le moteur reconnait les
-- deux, donc ce fichier peut cohabiter avec les controls.cfg existants
-- sans rien casser. Lignes retirees par rapport au fichier complet, et
-- pourquoi : RESET_CPU, SCREENSHOT, BUTTON_4, TILT, GRAB sont inutilisees 
-- par le vrai code KimmyScript, meme dans les jeux de tir.
--
-- COIN_2P et QUIT_PROGRAM ne sont pas des no-op partout :
-- moves.kimmy les traite, et plusieurs jeux de tir les utilisent bel et 
-- bien. Mais pour ce fichier partage pensé pour un jeu solo type DLe 
-- ils ne servent a rien : DLe gere son propre 2e joueur via START_2P, 
-- pas via une 2e piece, et ne teste jamais QUIT_PROGRAM. Les jeux de tir
-- qui en ont besoin ont deja leur propre controls.cfg complet et ne passent
-- donc jamais par ce repli.
--
-- BUTTON_3 bien qu'inutilisé reste dans le fichier pour les utilisateurs
-- souhaitant le mapper pour leurs jeux.


DEAD_ZONE = 15000

GO_UP           = { KEY_UP, JOY_UP, JOY_STICK_UP, RAWJOY_0.AXIS_1_NEG, RAWJOY_1.AXIS_1_NEG, RAWJOY_2.AXIS_1_NEG, RAWJOY_3.AXIS_1_NEG }
                        -- SWITCH_UP (0). Joy Up

GO_LEFT         = { KEY_LEFT, JOY_LEFT, JOY_STICK_LEFT, RAWJOY_0.AXIS_0_NEG, RAWJOY_1.AXIS_0_NEG, RAWJOY_2.AXIS_0_NEG, RAWJOY_3.AXIS_0_NEG }
                        -- SWITCH_LEFT (1). Joy Left

GO_DOWN         = { KEY_DOWN, JOY_DOWN, JOY_STICK_DOWN, RAWJOY_0.AXIS_1_POS, RAWJOY_1.AXIS_1_POS, RAWJOY_2.AXIS_1_POS, RAWJOY_3.AXIS_1_POS }
                        -- SWITCH_DOWN (2). Joy Down

GO_RIGHT        = { KEY_RIGHT, JOY_RIGHT, JOY_STICK_RIGHT, RAWJOY_0.AXIS_0_POS, RAWJOY_1.AXIS_0_POS, RAWJOY_2.AXIS_0_POS, RAWJOY_3.AXIS_0_POS }
                        -- SWITCH_RIGHT (3). Joy Right

COIN_1P         = { KEY_MAIN_5, JOY_SELECT, RAWJOY_0.BUTTON_7, RAWJOY_1.BUTTON_7, RAWJOY_2.BUTTON_7, RAWJOY_3.BUTTON_7 }
                        -- SWITCH_COIN1 (9). Insert Coin 1P

START_1P        = { KEY_MAIN_1, JOY_START, RAWJOY_0.BUTTON_6, RAWJOY_1.BUTTON_6, RAWJOY_2.BUTTON_6, RAWJOY_3.BUTTON_6 }
                        -- SWITCH_START1 (4). Start the Game 1P

START_2P        = { KEY_MAIN_2 }
                        -- SWITCH_START2 (5). Start the Game 2P

BUTTON_1        = { KEY_LCTRL, JOY_A, RAWJOY_0.BUTTON_3, RAWJOY_1.BUTTON_3, RAWJOY_2.BUTTON_3, RAWJOY_3.BUTTON_3 }
                        -- SWITCH_BUTTON1 (6). Main Action Button

BUTTON_2        = { KEY_LALT, JOY_B, RAWJOY_0.BUTTON_4, RAWJOY_1.BUTTON_4, RAWJOY_2.BUTTON_4, RAWJOY_3.BUTTON_4 }
                        -- SWITCH_BUTTON2 (7). Secondary Action Button

BUTTON_3        = { KEY_SPACE }
                        -- SWITCH_BUTTON3 (8). Third action Button (generally not used but can be mapped)

SAVE_1          = { KEY_F1, JOY_L1, RAWJOY_0.BUTTON_2, RAWJOY_1.BUTTON_2, RAWJOY_2.BUTTON_2, RAWJOY_3.BUTTON_2 }
                        -- SWITCH_SKILL1 (11). Save/Load Slot 1

SAVE_2          = { KEY_F2, JOY_R1, RAWJOY_0.BUTTON_5, RAWJOY_1.BUTTON_5, RAWJOY_2.BUTTON_5, RAWJOY_3.BUTTON_5 }
                        -- SWITCH_SKILL2 (12). Save/Load Slot 2

SAVE_3          = { KEY_F3, JOY_L2 }
                        -- SWITCH_SKILL3 (13). Save/Load Slot 3

OPTION_MENU     = { KEY_MAIN_9, JOY_SPECIAL, RAWJOY_0.BUTTON_8, RAWJOY_1.BUTTON_8, RAWJOY_2.BUTTON_8, RAWJOY_3.BUTTON_8 }
                        -- SWITCH_SERVICE (14). Launch Option Menu

SAVE_MENU       = { KEY_F4, JOY_X, RAWJOY_0.BUTTON_0, RAWJOY_1.BUTTON_0, RAWJOY_2.BUTTON_0, RAWJOY_3.BUTTON_0 }
                        -- SWITCH_TEST (15). Launch Save/Load Menu

PAUSE_GAME      = { KEY_P, JOY_Y, RAWJOY_0.BUTTON_1, RAWJOY_1.BUTTON_1, RAWJOY_2.BUTTON_1, RAWJOY_3.BUTTON_1 }
                        -- SWITCH_PAUSE (19). Pause the game

EXIT_MENU       = { KEY_ESCAPE, KEY_Q, RAWJOY_0.BUTTON_11, RAWJOY_1.BUTTON_11, RAWJOY_2.BUTTON_11, RAWJOY_3.BUTTON_11 }
                        -- SWITCH_CONSOLE (20). Launch Exit Menu (also works with Start+Select on joystick)
