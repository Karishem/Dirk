<?xml version="1.0"?>
<!-- Dirk (KimmyScript) for Batocera.
     Goes in /userdata/system/configs/emulationstation/
     Games: /userdata/roms/dirk/<Game>/<Game>.zdirk (+ its Movie folder),
     or an unzipped game folder with its .dirk. -->
<systemList>
  <system>
    <name>dirk</name>
    <fullname>Dirk</fullname>
    <manufacturer>KimmyScript</manufacturer>
    <path>/userdata/roms/dirk</path>
    <extension>.zdirk .dirk</extension>
    <command>bash /userdata/system/dirk/dirk-launch.sh %ROM%</command>
    <platform>dirk</platform>
    <theme>dirk</theme>
  </system>
</systemList>
